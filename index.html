
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 30px;
        }

        main {
            padding: 50px 20px;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>
    <header>
        <h1>Welcome to My Website</h1>
        <p>This is my first website using GitHub Pages!</p>
    </header>

    <main>
        <h2>About Me</h2>
        <p>Hello! I am learning how to create websites.</p>

        <button onclick="alert('Hello! Thanks for visiting!')">
            Click Me
        </button>
    </main>
</body>
</html>
